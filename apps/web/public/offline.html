<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Domus Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --ground: #f5f3ff;
        --surface: rgba(255, 255, 255, 0.94);
        --line: rgba(124, 58, 237, 0.18);
        --primary: #7c3aed;
        --accent: #10b981;
        --ink: #1f2937;
        --muted: #6b7280;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #120a24;
          --surface: rgba(20, 16, 34, 0.92);
          --line: rgba(255, 255, 255, 0.12);
          --ink: #f8fafc;
          --muted: #cbd5e1;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(124, 58, 237, 0.18), transparent 48%),
          linear-gradient(180deg, var(--ground), #ffffff);
        color: var(--ink);
      }

      .shell {
        width: min(100%, 420px);
        border: 1px solid var(--line);
        border-radius: 28px;
        overflow: hidden;
        background: var(--surface);
        backdrop-filter: blur(16px);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.16);
      }

      .hero {
        padding: 28px 28px 20px;
        background: linear-gradient(135deg, #7c3aed, #10b981);
        color: white;
        text-align: center;
      }

      .mark {
        margin: 0 auto 16px;
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        font-size: 1.5rem;
        font-weight: 700;
      }

      .content {
        padding: 24px 28px 28px;
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.75rem;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      button {
        margin-top: 24px;
        border: 0;
        border-radius: 14px;
        padding: 12px 20px;
        font-size: 0.95rem;
        font-weight: 700;
        color: white;
        background: linear-gradient(135deg, #7c3aed, #6d28d9);
        cursor: pointer;
        box-shadow: 0 14px 28px rgba(124, 58, 237, 0.22);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="hero">
        <span class="mark" aria-hidden="true">D</span>
        <div>Domus</div>
      </div>
      <div class="content">
        <h1>You're offline</h1>
        <p>Please check your internet connection and try again. Domus needs a network connection to load live property data.</p>
        <button type="button" onclick="window.location.reload()">Retry</button>
      </div>
    </div>
  </body>
</html>
