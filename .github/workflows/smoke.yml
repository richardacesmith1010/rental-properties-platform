name: Production smoke

on:
  # Schedule paused until the SMOKE_* repo secrets are added (2026-10-06). Restore:
  # schedule:
  #   - cron: "30 13 * * *"
  workflow_dispatch:

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOKE_OWNER_EMAIL: ${{ secrets.SMOKE_OWNER_EMAIL }}
      SMOKE_OWNER_PASSWORD: ${{ secrets.SMOKE_OWNER_PASSWORD }}
      SMOKE_MANAGER_EMAIL: ${{ secrets.SMOKE_MANAGER_EMAIL }}
      SMOKE_MANAGER_PASSWORD: ${{ secrets.SMOKE_MANAGER_PASSWORD }}
      SMOKE_TENANT_EMAIL: ${{ secrets.SMOKE_TENANT_EMAIL }}
      SMOKE_TENANT_PASSWORD: ${{ secrets.SMOKE_TENANT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run production smoke
        run: APP_URL=https://domusbase.com npm run smoke:web
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          if-no-files-found: ignore
