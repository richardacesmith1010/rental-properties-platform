# Sprint 230: information-security policy §6 — dependency alerts reviewed at least monthly.
# Version-update PRs are proposals only; each goes through the normal gate before merging.
# Not covered: apps/ios/ios/App/CapApp-SPM/Package.swift is generated by `cap sync`
# (LinkKit is pinned on purpose; bump it in a phone sprint).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/ios
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      capacitor:
        patterns: ["@capacitor/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
