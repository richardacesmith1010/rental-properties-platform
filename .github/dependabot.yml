# Sprint 230: information-security policy §6 — dependency alerts reviewed at least monthly.
# Version-update PRs are proposals only; each goes through the normal gate before merging.
# Major version jumps are ignored for version updates; take them on purpose in a planned sprint.
# @types/node stays on the Node 20 line (CI and Vercel run Node 20).
# Not covered: apps/ios/ios/App/CapApp-SPM/Package.swift is generated by `cap sync`
# (LinkKit is pinned on purpose; bump it in a phone sprint).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        versions: [">=21"]
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/ios
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      capacitor:
        patterns: ["@capacitor/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
